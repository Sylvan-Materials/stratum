name: Stratum C++ Spec Distiller
permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      spec_target:
        description: 'Select Specification & Target File'
        required: true
        default: 'cplusplus/draft :: concepts.tex'
        type: choice
        options:
          - 'cplusplus/draft :: concepts.tex'
          - 'cplusplus/draft :: meta.tex'
          - 'cplusplus/draft :: templates.tex'
          - 'cplusplus/draft :: ranges.tex'
          - 'stdgraph/P1709 :: specification.tex'
          - 'stdgraph/P1709 :: conventions.tex'
          - 'stdgraph/P1709 :: algo_intro.tex'
      custom_spec_target:
        description: 'Optional override (format: owner/repo :: filename.tex)'
        required: false
        default: ''
        type: string
      target_era:
        description: 'Target C++ Standard Era'
        required: true
        default: 'C++26'
        type: choice
        options:
          - C++26
          - C++29
#  push:
#    branches: [ main ]
#    paths:
#      - 'pipeline/stages/cpp-spec-distiller.md'
#      - '.github/workflows/stratum-distiller.yml'

env:
  MODEL_REPO: Qwen/Qwen2.5-Coder-7B-Instruct-GGUF
  MODEL_FILE: qwen2.5-coder-7b-instruct-q4_k_m.gguf
  LLAMA_CPP_REF: master
  CTX_DISTILLER: 16384

jobs:
  distill-cpp-spec:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Stratum Repository
        uses: actions/checkout@v4

      - name: Cache GGUF Model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: gguf-${{ env.MODEL_FILE }}

      - name: Download GGUF Model (Cache Miss Only)
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/models
          curl -sSL --fail -o ".cache/models/$MODEL_FILE" \
           "https://huggingface.co/${{ env.MODEL_REPO }}/resolve/main/${{ env.MODEL_FILE }}"

      - name: Cache Compiled llama-cli
        id: cache-llama-bin
        uses: actions/cache@v4
        with:
          path: llama.cpp/build/bin
          key: llama-cli-${{ runner.os }}-${{ env.LLAMA_CPP_REF }}-portable-v1
          restore-keys: |
            llama-cli-${{ runner.os }}-

      - name: Build llama-cli (Cache Miss Only)
        if: steps.cache-llama-bin.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake build-essential libcurl4-openssl-dev
          git clone --depth 1 --branch ${{ env.LLAMA_CPP_REF }} https://github.com/ggml-org/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DGGML_NATIVE=OFF \
            -DGGML_AVX2=ON \
            -DGGML_FMA=ON \
            -DGGML_F16C=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_TESTS=ON
          cmake --build llama.cpp/build --target llama-cli test-gbnf-validator -j$(nproc)

      - name: Resolve Target Specification & Chapter
        id: resolve
        shell: bash
        run: |
          TARGET="${{ inputs.custom_spec_target }}"
          if [ -z "$TARGET" ]; then
            TARGET="${{ inputs.spec_target || 'cplusplus/draft :: concepts.tex' }}"
          fi

          SOURCE="${TARGET%% :: *}"
          CHAPTER="${TARGET##* :: }"

          if [ "$SOURCE" = "stdgraph/P1709" ]; then
            SUBDIR="tex"
            PREFIX="P1709"
          else
            SUBDIR="source"
            PREFIX="draft"
          fi

          echo "SOURCE=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "SUBDIR=$SUBDIR" >> "$GITHUB_OUTPUT"
          echo "PREFIX=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "CHAPTER=$CHAPTER" >> "$GITHUB_OUTPUT"
          echo "ERA=${{ inputs.target_era || 'C++26' }}" >> "$GITHUB_OUTPUT"
          mkdir -p scratchpad
          echo "Fetching $CHAPTER from $SOURCE/$SUBDIR..."
          curl -sSL --fail -o "scratchpad/$CHAPTER" \
            "https://raw.githubusercontent.com/$SOURCE/main/$SUBDIR/$CHAPTER"

          # Strip LaTeX comments, index entries, and layout noise to save context tokens
          sed -e 's/%.*$//' \
              -e 's/\\indexlibrary[^}]*}//g' \
              -e 's/\\indextext[^}]*}//g' \
              -e '/^[[:space:]]*$/d' \
              "scratchpad/$CHAPTER" > scratchpad/cleaned_spec.txt

          echo "Cleaned spec line count: $(wc -l < scratchpad/cleaned_spec.txt)"

      - name: Assemble Distiller Prompt & Synthesize Constraints
        shell: bash
        run: |
          SOURCE="${{ steps.resolve.outputs.SOURCE }}"
          PREFIX="${{ steps.resolve.outputs.PREFIX }}"
          CHAPTER="${{ steps.resolve.outputs.CHAPTER }}"
          ERA="${{ steps.resolve.outputs.ERA }}"
          BASENAME="${CHAPTER%.tex}"

          cat pipeline/stages/cpp-spec-distiller.md > scratchpad/combined_distill_prompt.md
          printf '\n\n## Target Standard Era: %s\n## Raw ISO Specification Source (%s)\n```latex\n' "ERA" "CHAPTER" >> scratchpad/combined_distill_prompt.md
          head -n 900 scratchpad/cleaned_spec.txt >> scratchpad/combined_distill_prompt.md
          printf '\n```\n' >> scratchpad/combined_distill_prompt.md

          ./llama.cpp/build/bin/llama-cli \
            -m ".cache/models/$MODEL_FILE" \
            -f scratchpad/combined_distill_prompt.md \
            -st \
            --temp 0.0 \
            --repeat-penalty 1.15 \
            -n 1200 \
            --seed 42 \
            --log-disable \
            --no-display-prompt \
            -t $(nproc) \
            -c $CTX_DISTILLER \
            > scratchpad/raw_distill.txt

          # Extract starting from the first ### heading and strip the llama.cpp stats footer
          awk '/^### A\./{flag=1} /^\[ Prompt:/{flag=0} flag' scratchpad/raw_distill.txt > "scratchpad/distilled-${PREFIX}-${BASENAME}.md"
          if [ ! -s "scratchpad/distilled-${PREFIX}-${BASENAME}.md" ]; then
            cp scratchpad/raw_distill.txt "scratchpad/distilled-${PREFIX}-${BASENAME}.md"
          fi

      - name: Upload Distilled Spec Stratum for Human Review
        uses: actions/upload-artifact@v4
        with:
          name: distilled-cpp-spec-stratum
          path: |
            scratchpad/distilled-*.md
            scratchpad/cleaned_spec.txt
          retention-days: 7

      - name: Stage Distilled Spec Stratum for PR Review
        shell: bash
        run: |
          mkdir -p strata/specs
          cp scratchpad/distilled-*.md strata/specs/

      - name: Create Pull Request with Distilled Stratum
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: strata/specs
          commit-message: "chore(stratum): distill ${{ steps.resolve.outputs.PREFIX }}-${{ steps.resolve.outputs.CHAPTER }}"
          title: "Distilled Stratum: ${{ steps.resolve.outputs.SOURCE }} (${{ steps.resolve.outputs.CHAPTER }})"
          body: |
            Automated specification distillation generated by `${{ env.MODEL_REPO }}`.
            - **Source:** `${{ steps.resolve.outputs.SOURCE }}`
            - **Target File:** `${{ steps.resolve.outputs.CHAPTER }}`
            - **Era:** `${{ steps.resolve.outputs.ERA }}`
            
            Review the distilled rules below and merge into `main` to make them available to downstream synthesis workflows.
          branch: "distill/${{ steps.resolve.outputs.PREFIX }}-${{ steps.resolve.outputs.CHAPTER }}"
          delete-branch: true
