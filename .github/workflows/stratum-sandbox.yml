name: Stratum Sandbox Prototype

on:
  push:
    paths:
      - 'test/sandbox/**'
      - '.github/workflows/stratum-sandbox.yml'

env:
  MODEL_REPO: Qwen/Qwen2.5-Coder-7B-Instruct-GGUF
  MODEL_FILE: qwen2.5-coder-7b-instruct-q4_k_m.gguf
  LLAMA_CPP_REF: master

jobs:
  verify-cycle:
    runs-on: ubuntu-latest
    container:
      # Using a cutting-edge GCC container to catch modern standard features
      image: gcc:latest 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Clang for Cross-Compiler Check
        run: |
          apt-get update && apt-get install -y --no-install-recommends clang

      - name: Cache Compiled llama-cli
        id: cache-llama-bin
        uses: actions/cache@v4
        with:
          path: llama.cpp/build/bin
          key: llama-cli-${{ runner.os }}-${{ env.LLAMA_CPP_REF }}-portable-v1

      - name: Build llama-cli (Cache Miss Only)
        if: steps.cache-llama-bin.outputs.cache-hit != 'true'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake build-essential libcurl4-openssl-dev
          git clone --depth 1 --branch ${{ env.LLAMA_CPP_REF }} https://github.com/ggml-org/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DGGML_NATIVE=OFF \
            -DGGML_AVX2=ON \
            -DGGML_FMA=ON \
            -DGGML_F16C=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_TESTS=ON
          cmake --build llama.cpp/build --target llama-cli test-gbnf-validator -j$(nproc)

      - name: Cache GGUF Model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: gguf-${{ env.MODEL_FILE }}

      - name: Download GGUF Model (Cache Miss Only)
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/models
          curl -L --fail -o ".cache/models/${{ env.MODEL_FILE }}" \
            "https://huggingface.co/${{ env.MODEL_REPO }}/resolve/main/${{ env.MODEL_FILE }}"

      - name: Execute Stratum Prompt Layer
        run: |
          mkdir -p scratchpad/doctest
          ./llama.cpp/build/bin/llama-cli \
            -m ".cache/models/${{ env.MODEL_FILE }}" \
            -f test/sandbox/adjacency-list-prompt.md \
            -st \
            --temp 0.0 \
            --seed 42 \
            --log-disable \
            --no-display-prompt \
            -t $(nproc) \
            -c 8192 \
            > scratchpad/raw_output.txt

          # Extract everything between ```cpp and ``` (or fallback to raw output if no fences)
          awk '/^```cpp/{flag=1; next} /^```/{flag=0} flag' scratchpad/raw_output.txt > scratchpad/generated_graph.hpp
          if [ ! -s scratchpad/generated_graph.hpp ]; then
            cp scratchpad/raw_output.txt scratchpad/generated_graph.hpp
          fi
      - name: Verify Portable C++ Syntax (Clang)
        continue-on-error: true
        run: |
          set -o pipefail
          echo "=== CLANG++ SYNTAX CHECK ===" > scratchpad/validation.log
          clang++ -fsyntax-only -x c++-header -std=c++2c -Wall -Wextra -pedantic scratchpad/generated_graph.hpp 2>&1 | tee -a scratchpad/validation.log

      - name: Fetch Ephemeral doctest.h Header
        run: |
          curl -sSL --fail -o scratchpad/doctest/doctest.h \
            "https://raw.githubusercontent.com/doctest/doctest/master/doctest/doctest.h"

      - name: Synthesize Ephemeral doctest Suite (Context-Aware)
        run: |
          cat test/sandbox/adjacency-list-tests-prompt.md > scratchpad/combined_test_prompt.md
          cat << 'EOF' >> scratchpad/combined_test_prompt.md


          ## Synthesized Target Header (`generated_graph.hpp`)
          Write doctest cases strictly against the exact signatures defined below:
          ```cpp
          EOF
          cat scratchpad/generated_graph.hpp >> scratchpad/combined_test_prompt.md
          echo '```' >> scratchpad/combined_test_prompt.md

          ./llama.cpp/build/bin/llama-cli \
            -m ".cache/models/$MODEL_FILE" \
            -f scratchpad/combined_test_prompt.md \
            -st \
            --temp 0.0 \
            --seed 42 \
            --log-disable \
            --no-display-prompt \
            -t $(nproc) \
            -c 8192 \
            > scratchpad/raw_test_output.txt

          awk '/^```cpp/{flag=1; next} /^```/{flag=0} flag' scratchpad/raw_test_output.txt > scratchpad/test_graph.cpp
          if [ ! -s scratchpad/test_graph.cpp ]; then
            cp scratchpad/raw_test_output.txt scratchpad/test_graph.cpp
          fi

      - name: Compile and Run Synthesized doctest Suite
        continue-on-error: true
        run: |
          set -o pipefail
          echo -e "\n=== G++ COMPILE & ASAN/UBSAN TEST RUN ===" >> scratchpad/validation.log
          g++ -std=c++2c -O1 -g \
            -fsanitize=address,undefined \
            -fno-omit-frame-pointer \
            -Wall -Wextra -pedantic \
            -Iscratchpad -Iscratchpad/doctest \
            scratchpad/test_graph.cpp -o scratchpad/run_tests 2>&1 | tee -a scratchpad/validation.log
          ./scratchpad/run_tests 2>&1 | tee -a scratchpad/validation.log

      - name: Upload Ephemeral Outputs for Human Validation
        uses: actions/upload-artifact@v4
        with:
          name: ephemeral-cpp-stratum-output
          path: |
            scratchpad/generated_graph.hpp
            scratchpad/test_graph.cpp
            scratchpad/validation.log
          retention-days: 7
